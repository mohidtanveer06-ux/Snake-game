<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT Snake Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            min-height: 100vh;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .score-board {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #4ecca3;
        }

        #gameBoard {
            background-color: #0f3460;
            border: 4px solid #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
            display: block;
            max-width: 100%;
            height: auto;
            touch-action: none;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #c73852;
        }

        .mobile-controls {
            display: grid;
            grid-template-columns: repeat(3, 58px);
            grid-template-rows: repeat(2, 50px);
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }

        .control-btn {
            margin: 0;
            padding: 0;
            font-size: 1.4rem;
            touch-action: manipulation;
        }

        .up-btn {
            grid-column: 2;
        }

        .left-btn {
            grid-column: 1;
            grid-row: 2;
        }

        .down-btn {
            grid-column: 2;
            grid-row: 2;
        }

        .right-btn {
            grid-column: 3;
            grid-row: 2;
        }

        .help-text {
            margin-top: 12px;
            color: #b8c1ec;
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.7rem;
            }

            .help-text {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>MT Snake Game</h1>
        <div class="score-board">Score: <span id="score">0</span></div>
        <canvas id="gameBoard" width="400" height="400"></canvas>
        <button id="restartBtn" type="button">Restart Game</button>
        <div class="mobile-controls" aria-label="Mobile controls">
            <button class="control-btn up-btn" type="button" data-direction="up" aria-label="Move up">▲</button>
            <button class="control-btn left-btn" type="button" data-direction="left" aria-label="Move left">◀</button>
            <button class="control-btn down-btn" type="button" data-direction="down" aria-label="Move down">▼</button>
            <button class="control-btn right-btn" type="button" data-direction="right" aria-label="Move right">▶</button>
        </div>
        <p class="help-text">Computer: Arrow keys / WASD &nbsp; | &nbsp; Mobile: swipe or buttons</p>
    </div>

    <script>
        const canvas = document.getElementById("gameBoard");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const restartBtn = document.getElementById("restartBtn");
        const controlButtons = document.querySelectorAll(".control-btn");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        let score = 0;
        let dx = gridSize;
        let dy = 0;
        let foodX = 0;
        let foodY = 0;
        let snake = [];
        let gameInterval;
        let changingDirection = false;

        document.addEventListener("keydown", changeDirection);
        restartBtn.addEventListener("click", resetGame);
        controlButtons.forEach((button) => {
            button.addEventListener("click", () => changeDirection(button.dataset.direction));
        });
        let touchStartX = 0;
        let touchStartY = 0;
        canvas.addEventListener("touchstart", (event) => {
            touchStartX = event.changedTouches[0].clientX;
            touchStartY = event.changedTouches[0].clientY;
        }, { passive: true });
        canvas.addEventListener("touchend", handleSwipe, { passive: true });
        resetGame();

        function resetGame() {
            score = 0;
            dx = gridSize;
            dy = 0;
            changingDirection = false;
            scoreElement.textContent = score;
            snake = [
                { x: gridSize * 4, y: 0 },
                { x: gridSize * 3, y: 0 },
                { x: gridSize * 2, y: 0 },
                { x: gridSize, y: 0 }
            ];
            createFood();
            clearInterval(gameInterval);
            gameInterval = setInterval(main, 100);
        }

        function main() {
            if (hasGameEnded()) {
                clearInterval(gameInterval);
                alert(`Game Over! Final score: ${score}`);
                return;
            }

            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#0f3460";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#4ecca3" : "#22babb";
                ctx.strokeStyle = "#0f3460";
                ctx.fillRect(part.x, part.y, gridSize, gridSize);
                ctx.strokeRect(part.x, part.y, gridSize, gridSize);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === foodX && head.y === foodY) {
                score += 10;
                scoreElement.textContent = score;
                createFood();
            } else {
                snake.pop();
            }
        }

        function changeDirection(input) {
            const key = typeof input === "string" ? input : input.key;
            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingLeft = dx === -gridSize;
            const goingRight = dx === gridSize;

            if (changingDirection) {
                return;
            }

            if ((key === "ArrowLeft" || key === "a" || key === "left") && !goingRight) {
                dx = -gridSize;
                dy = 0;
                changingDirection = true;
            } else if ((key === "ArrowUp" || key === "w" || key === "up") && !goingDown) {
                dx = 0;
                dy = -gridSize;
                changingDirection = true;
            } else if ((key === "ArrowRight" || key === "d" || key === "right") && !goingLeft) {
                dx = gridSize;
                dy = 0;
                changingDirection = true;
            } else if ((key === "ArrowDown" || key === "s" || key === "down") && !goingUp) {
                dx = 0;
                dy = gridSize;
                changingDirection = true;
            }
        }

        function handleSwipe(event) {
            const touch = event.changedTouches[0];
            const deltaX = touch.clientX - touchStartX;
            const deltaY = touch.clientY - touchStartY;
            const minimumSwipe = 20;

            if (Math.max(Math.abs(deltaX), Math.abs(deltaY)) < minimumSwipe) {
                return;
            }

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                changeDirection(deltaX > 0 ? "right" : "left");
            } else {
                changeDirection(deltaY > 0 ? "down" : "up");
            }
        }

        function createFood() {
            do {
                foodX = Math.floor(Math.random() * tileCount) * gridSize;
                foodY = Math.floor(Math.random() * tileCount) * gridSize;
            } while (snake.some((part) => part.x === foodX && part.y === foodY));
        }

        function drawFood() {
            ctx.fillStyle = "#e94560";
            ctx.fillRect(foodX, foodY, gridSize, gridSize);
        }

        function hasGameEnded() {
            const head = snake[0];
            const hitWall =
                head.x < 0 ||
                head.x >= canvas.width ||
                head.y < 0 ||
                head.y >= canvas.height;
            const hitSelf = snake
                .slice(4)
                .some((part) => part.x === head.x && part.y === head.y);

            return hitWall || hitSelf;
        }
    </script>
</body>
</html>
